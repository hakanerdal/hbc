<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup: Hüküm Kaydı</title>
  <link rel="stylesheet" href="../../../css/style.css" />
  <link rel="stylesheet" href="mock-shell.css" />
  <link rel="stylesheet" href="../../../css/mock-bootstrap.css" />
</head>
<body>
<div class="layout">
  <nav id="sidebar"></nav>
  <main>
    <h1 class="mock-dev-only">Mockup: Hüküm kaydı</h1>
    <p class="subtitle mock-dev-only">Yeni / düzenle</p>
    <div class="mock-app-shell">
      <nav class="mock-app-menu" aria-label="Uygulama menüsü">
        <div class="menu-app">Görüş Yazısı</div>
        <button class="mock-menu-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#mock-menu-yazi" aria-expanded="true" aria-controls="mock-menu-yazi">Görüş Yazısı</button>
        <div class="collapse show mock-menu-collapse" id="mock-menu-yazi">
          <div class="mock-menu-sub">
            <a href="yazi-liste.html">Yazılar</a>
            <a href="hukumler-liste.html" class="active">Hükümler Tablosu</a>
          </div>
        </div>
      </nav>
      <div class="mock-app-body">
        <div class="mock-header">
          <div class="mock-breadcrumb">Görüş Yazısı › Hükümler Tablosu › Düzenle</div>
          <strong>Hüküm Kaydı</strong>
        </div>
        <div class="mock-content mock-content--form">
          <div class="mock-form-panel mock-form-panel--hukum">
            <div class="mock-field">
              <label for="f-hukum-kaynak">Kaynak *</label>
              <select id="f-hukum-kaynak" class="form-select">
                <option value="Yönetmelik" selected>Yönetmelik</option>
                <option value="Özel Hüküm">Özel Hüküm</option>
              </select>
            </div>
            <div class="mock-field">
              <label for="f-hukum-koruma">Koruma Alanı *</label>
              <select id="f-hukum-koruma" class="form-select" data-value="Maksimum Su Kotu"></select>
            </div>
            <div class="mock-field">
              <label for="f-hukum-sektor">Sektör *</label>
              <select id="f-hukum-sektor" class="form-select" data-value="Göl Aynasındaki Faaliyetler"></select>
            </div>
            <div class="mock-field">
              <label for="f-hukum-madde">İlgili Madde *</label>
              <textarea class="mock-input" id="f-hukum-madde" rows="6">Madde 8 (3): Sportif olta balıkçılığı içme suyu alma yapısına 300 metreden uzakta yapılabilir.</textarea>
            </div>
            <div class="mock-footer">
              <a href="hukumler-liste.html" class="mock-btn">← Listeye Dön</a>
              <a href="hukumler-liste.html" class="mock-btn mock-btn-primary">Kaydet</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
window.TASK_HUB = {
  taskRoot: '../../..',
  page: 'mock-hukumler-form',
  calisma: {
    id: 'yazi_olustur',
    label: 'Yazı Oluştur',
    base: '..',
    mockups: [
      { id: 'mock-yazi-liste', label: 'Yazı Listesi', href: 'mockup/yazi-liste.html' },
      { id: 'mock-yazi-form', label: 'Yazı Formu', href: 'mockup/yazi-form.html' },
      { id: 'mock-hukumler-liste', label: 'Hükümler Tablosu', href: 'mockup/hukumler-liste.html' },
      { id: 'mock-hukumler-form', label: 'Hüküm Kaydı', href: 'mockup/hukumler-form.html' }
    ],
    islerHref: 'isler.html'
  }
};
</script>
<script src="../../../assets/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
<script src="mock-hukumler-tablosu.js"></script>
<script src="mock-hukumler-form.js"></script>
<script src="../../../js/calismalar-meta.js"></script>
<script src="../../../js/rapor-widgets.js"></script>
<script src="../../../js/calisma-cursor.js"></script>
<script src="../../../js/sunum-query.js"></script>
<script src="../../../js/mock-sunum.js"></script>
<script src="../../../js/nav.js"></script>
</body>
</html>
