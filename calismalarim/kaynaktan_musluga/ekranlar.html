<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ekranlar — Kaynaktan Musluğa</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/mock-bootstrap.css" />
</head>
<body>
<div class="layout">
  <nav id="sidebar"></nav>
  <main>
    <h1>Ekranlar</h1>
    <p class="subtitle">Kaynaktan Musluğa — mockup ekranları</p>

    <div class="lead">
      Mevcut mockup'lara tıklayarak önizleyin. <strong>+ Yeni ekran</strong> ile adım adım soruları yanıtlayın;
      Cursor metnini kopyalayıp sohbete yapıştırın.
    </div>

    <div class="ekran-toolbar">
      <button type="button" class="calisma-action-btn calisma-action-btn--primary" id="btn-yeni-ekran">+ Yeni ekran</button>
    </div>

    <p class="empty-note" id="ekran-empty" hidden>Henüz mockup yok.</p>
    <div id="ekran-list"></div>
  </main>
</div>
<script>
window.TASK_HUB = {
  taskRoot: '../..',
  page: 'calisma-ekranlar',
  calisma: {
    id: 'kaynaktan_musluga',
    label: 'Kaynaktan Musluğa',
    base: '.',
    mockups: [
      { id: 'mock-dashboard', label: 'Dashboard', href: 'mockup/dashboard.html' },
      { id: 'mock-kaynak-liste', label: 'Kaynak listesi', href: 'mockup/kaynak-liste.html' },
      { id: 'mock-kaynak-form', label: 'Kaynak formu', href: 'mockup/kaynak-form.html' },
      { id: 'mock-tesis-liste', label: 'Tesis listesi', href: 'mockup/tesis-liste.html' },
      { id: 'mock-tesis-form', label: 'Tesis formu', href: 'mockup/tesis-form.html' },
      { id: 'mock-musluk-liste', label: 'Musluk listesi', href: 'mockup/musluk-liste.html' },
      { id: 'mock-musluk-form', label: 'Musluk formu', href: 'mockup/musluk-form.html' }
    ],
    islerHref: 'isler.html'
  }
};
</script>
<script src="../../js/sunum-query.js"></script>
<script src="../../js/rapor-widgets.js"></script>
<script src="../../js/ekran-wizard.js"></script>
<script src="../../js/ekranlar-page.js"></script>
<script src="../../js/nav.js"></script>
</body>
</html>
